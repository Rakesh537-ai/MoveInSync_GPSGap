services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DEMO_MODE: "true"
      DATABASE_PATH: /app/data/gps.db
      ROUTING_PROVIDER: mock
    volumes:
      - gps-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  gps-data:
